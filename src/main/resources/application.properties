spring.application.name=demo

server.port=8080

spring.datasource.url=
spring.datasource.username=

#everybody reset their paasssword in pgadmi. Go to querry tool write this querry ALTER USER postgres WITH PASSWORD 'test123';
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Use Gmail App Password (16 characters, no spaces) - NOT your regular password
# Generate at: https://myaccount.google.com/apppasswords
spring.mail.username=d
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

cloudinary.cloud_name=
cloudinary.api_key=
cloudinary.api_secret=
cloudinary.secure=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
